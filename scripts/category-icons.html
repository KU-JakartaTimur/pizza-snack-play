<!--
  Sumber ikon kategori Pizza Snack Play — delapan gambar, satu berkas.

  Berkas ini **bukan** halaman aplikasi; ia hanya dipakai
  `scripts/generate-category-icons.mjs` untuk memanggang PNG-nya lewat
  browser. Tidak ada yang memuatnya saat aplikasi berjalan.

  Kenapa SVG lalu dipanggang, bukan digambar langsung dengan Pillow:

  - Semua gambar sudah ada di repo sebagai berkas yang bisa dibaca manusia,
    jadi satu ikon bisa diperbaiki tanpa menyentuh kode generator.
  - Ikon kategori disimpan di kolom `categories.image` sebagai **data URI
    base64**. Aplikasi menolak SVG (`validateCategoryImage` hanya menerima
    png/jpeg/webp/gif), sebab SVG bisa membawa skrip — jadi bentuk simpannya
    harus raster.

  Aturan gambar, supaya kedelapan ikon tampak satu keluarga:

  - Latar **penuh 512x512** tanpa sudut membulat. Pembulatan datang dari
    kelas `rounded-lg` pada `<img>`; kalau ikonnya sendiri yang membulat,
    sudutnya akan membulat dua kali.
  - Latar memakai gradien tiga titik dari warna kategori itu sendiri (kolom
    `categories.color`), dicampur putih di atas dan digelapkan di bawah.
  - Bentuknya putih, dengan rincian sekunder memakai putih transparan atau
    hitam transparan — bukan warna lain — supaya tetap terbaca di warna
    kategori apa pun, termasuk abu-abu "Lainnya".
  - Tiap bentuk diberi garis `rgba(0,0,0,0.16)` tipis agar tidak saling
    melebur saat putih bertemu putih.
  - `<g transform="translate(256 256) scale(1.1) translate(-256 -256)">`
    memperbesar seluruh bentuk 10% dari titik tengah. Semua koordinat di
    dalamnya ditulis pada bidang 512 dengan margin longgar; tanpa skala ini
    bentuknya terlihat kekecilan di thumbnail 32px.
-->
