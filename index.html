<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#51277C" />
    <meta name="background-color" content="#51277C" />
    <meta name="description" content="Aplikasi manajemen & informasi jadwal piket snack sekolah" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snack Play" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Snack Play" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/vite.svg" color="#51277C" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="/pwa/icon-512x512.png" />

    <title>Pizza Snack Play</title>

    <!--
      Penangkap `beforeinstallprompt`.

      Event ini hanya menyala sekali, segera setelah Chrome selesai memvalidasi
      manifest + service worker. Banner pemasangan dirender di dalam AppShell,
      yang baru muncul setelah sesi diverifikasi ke `/auth/me` — satu round-trip
      jaringan. Tanpa penangkap di sini event-nya sudah lewat sebelum React
      sempat memasang listener, dan tombol Pasang tidak pernah muncul.

      Diletakkan di <head> sebagai skrip klasik supaya berjalan lebih dulu
      daripada bundel aplikasi, yang bertipe module dan karenanya ditunda.
    -->
    <script>
      (function () {
        window.__pwaInstallPrompt = null;

        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          window.__pwaInstallPrompt = event;
          // Memberi tahu hook yang mungkin baru terpasang setelah ini.
          window.dispatchEvent(new CustomEvent("pwa-install-available"));
        });

        window.addEventListener("appinstalled", function () {
          window.__pwaInstallPrompt = null;
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker
              .register("/sw.js")
              .then(function (registration) {
                console.log("[PWA] Service Worker registered:", registration.scope);

                registration.addEventListener("updatefound", function () {
                  const newWorker = registration.installing;
                  if (newWorker) {
                    newWorker.addEventListener("statechange", function () {
                      if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                        window.dispatchEvent(new CustomEvent("sw-update-available"));
                      }
                    });
                  }
                });
              })
              .catch(function (err) {
                console.error("[PWA] Service Worker registration failed:", err);
              });
          });
        }
      })();
    </script>
  </body>
</html>
